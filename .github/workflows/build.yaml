name: Releases on pocketbase/release
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      pocketbase: ${{ steps.pocketbase.outputs.result }}
      package: ${{ steps.package.outputs.result }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Get latest pocketbase release
        id: pocketbase
        env:
          UPSTREAM: https://ganigeorgiev.com
          PROJECT: pocketbase
          REPO: pocketbase
          CHANNEL: default
        run: |
          set -euo pipefail
          api="${UPSTREAM}/api/collections"

          project_id=$(curl -fsSL --get "${api}/projects/records" \
            --data-urlencode "perPage=1" \
            --data-urlencode "filter=name='${PROJECT}'" \
            --data-urlencode "fields=id" | jq -er '.items[0].id')

          repo_id=$(curl -fsSL --get "${api}/repositories/records" \
            --data-urlencode "perPage=1" \
            --data-urlencode "filter=project='${project_id}' && name='${REPO}'" \
            --data-urlencode "fields=id" | jq -er '.items[0].id')

          channel_id=$(curl -fsSL --get "${api}/channels/records" \
            --data-urlencode "perPage=1" \
            --data-urlencode "filter=repository='${repo_id}' && name='${CHANNEL}'" \
            --data-urlencode "fields=id" | jq -er '.items[0].id')

          tag=$(curl -fsSL --get "${api}/releases/records" \
            --data-urlencode "perPage=20" \
            --data-urlencode "sort=-semver" \
            --data-urlencode "filter=channel='${channel_id}' && draft=false" \
            --data-urlencode "fields=tag" \
            | jq -er '[.items[].tag | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')

          echo "result=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Get latest package version
        id: package
        uses: actions/github-script@v9
        env:
          PACKAGE_NAME: pocketbase
          PACKAGE_TYPE: container
        with:
          result-encoding: string
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {PACKAGE_NAME,PACKAGE_TYPE} = process.env;
            const {data: packages} = await github.rest.packages.getAllPackageVersionsForPackageOwnedByAuthenticatedUser({
              org: context.repo.owner,
              package_type: PACKAGE_TYPE,
              package_name: PACKAGE_NAME,
            })

            const latest = packages.filter((p) =>
              p.metadata.container.tags.includes("latest")
            )[0];

            return latest.metadata.container.tags.find((v) => /^v?\d+\.\d+\.\d+$/.test(v)) || '0.0.0'

      - name: Resolve release version
        id: version
        run: echo "value=${{ github.event.inputs.version || steps.pocketbase.outputs.result }}" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: check
    if: (needs.check.outputs.pocketbase != needs.check.outputs.package) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to docker
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/kdpuvvadi/pocketbase
            kdpuvvadi/pocketbase
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.check.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.check.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: Dockerfile
          provenance: false
          build-args: VERSION=${{ needs.check.outputs.version }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump:
    runs-on: ubuntu-latest
    needs: check
    if: (needs.check.outputs.pocketbase != needs.check.outputs.package) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bump Dockerfile, push branch, tag, and release
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="release/v${VERSION}"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          sed -i "s/^ARG VERSION=.*/ARG VERSION=${VERSION}/" Dockerfile
          git add Dockerfile
          git commit -m "chore: bump PocketBase to ${VERSION}"
          git push -u origin "$BRANCH"

          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "PocketBase ${VERSION}" \
            --target "$BRANCH"
